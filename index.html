<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de paletas interactivo</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Generador de paletas interactivo - Colorfly Studio</h1>
        <p>Seleccioná el tamaño de la paleta y obtené colores aleatorios.</p>
    </header>

    <main>
        <section class="controles">
            <label for="tamanioPaleta">Elige el tamaño de la paleta:</label>
            <select id="tamanioPaleta" name="tamanioPaleta">
                <option value="6">6 colores</option>
                <option value="8">8 colores</option>
                <option value="9">9 colores</option>
            </select>
            <button id="btnGenerarPaleta">Generar paleta</button>
        </section>

        <section class="paleta">
            <h2>Paleta de colores:</h2>
            <p id="mensajeFeedback" aria-live="polite"></p>
            <div id="contenedorColores"></div>
            <button id="btnGuardarPaleta" type="button">Guardar paleta</button>
        </section>

        <section class="paletas-guardadas">
            <h2>Paletas guardadas:</h2>
            <div id="contenedorPaletasGuardadas"></div>
        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
