<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de paletas interactivo</title>
</head>
<body>
    <header>
        <h1>Generador de paletas interactivo - Colorfly Studio</h1>
        <p>Selecciona el tamaño de la paleta y obtene los colores aleatorios</p>
    </header>

    <main>
        <section>
            <label for="tamanioPaleta">Elige el tamaño de la paleta:</label>
            <select id="tamanioPaleta" name="tamanioPaleta">
                <option value="6">6 colores</option>
                <option value="8">8 colores</option>
                <option value="9">9 colores</option>
            </select>
            <button id="btnGenerarPaleta">Generar paleta</button>
        </section>

        <section>
            <h2>Paleta de colores:</h2>
            <div id="contenedorColores"></div>
        </section>

    </main>
</body>
</html>
